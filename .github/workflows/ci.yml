name: CI

on:
  push:
  pull_request:
  # A manual run on any branch builds the signed bundle (to check the build and warm the caches);
  # only main uploads it.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test --coverage
      - run: bunx expo-doctor

  # Every push to main that passes verify goes to the Play internal testing track (testers only).
  # Closed testing and production stay a manual promotion in Play Console.
  # Setup (secrets, service account): docs/store/google-play.md, "Automatic internal releases".
  #
  # Build time: most of a cold build is native C++ (React Native, Reanimated, Worklets, Expo).
  # - Only the two ARM ABIs that phones use; x86 and x86_64 are emulator-only.
  # - ccache keeps compiled C++ between runs; setup-gradle keeps Gradle's caches.
  # - Lint vital is skipped here; `bun run lint` and the tests run in verify.
  release-internal:
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: play-internal
      cancel-in-progress: false
    steps:
      - name: Check the release secrets
        id: secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ONE_REMOTE_UPLOAD_KEYSTORE_BASE64 }}
          ONE_REMOTE_UPLOAD_STORE_PASSWORD: ${{ secrets.ONE_REMOTE_UPLOAD_STORE_PASSWORD }}
          ONE_REMOTE_UPLOAD_KEY_ALIAS: ${{ secrets.ONE_REMOTE_UPLOAD_KEY_ALIAS }}
          ONE_REMOTE_UPLOAD_KEY_PASSWORD: ${{ secrets.ONE_REMOTE_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in UPLOAD_KEYSTORE_BASE64 ONE_REMOTE_UPLOAD_STORE_PASSWORD ONE_REMOTE_UPLOAD_KEY_ALIAS ONE_REMOTE_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not releasing to Play: missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle's own caches (dependencies, wrapper, build cache). Written from main and manual runs.
      - if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: false
      - if: steps.secrets.outputs.ready == 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android-release
          max-size: 2G
      - if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      # Play needs a higher versionCode on every upload. Release 1 was uploaded by hand, so CI
      # starts at 2 and counts up with the workflow run number.
      - name: Set the versionCode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version_code=$(( GITHUB_RUN_NUMBER + 1 ))
          jq --argjson vc "$version_code" '.expo.android.versionCode = $vc' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "versionCode $version_code"

      - name: Generate the native project
        if: steps.secrets.outputs.ready == 'true'
        run: bunx expo prebuild -p android --clean

      # CMake (3.17+) picks up the compiler launcher from the environment, so every native module
      # compiles through ccache. Content hashing, because CI checks files out with new timestamps.
      - name: Build the signed bundle
        if: steps.secrets.outputs.ready == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ONE_REMOTE_UPLOAD_KEYSTORE_BASE64 }}
          ONE_REMOTE_UPLOAD_STORE_PASSWORD: ${{ secrets.ONE_REMOTE_UPLOAD_STORE_PASSWORD }}
          ONE_REMOTE_UPLOAD_KEY_ALIAS: ${{ secrets.ONE_REMOTE_UPLOAD_KEY_ALIAS }}
          ONE_REMOTE_UPLOAD_KEY_PASSWORD: ${{ secrets.ONE_REMOTE_UPLOAD_KEY_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          export ONE_REMOTE_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ONE_REMOTE_UPLOAD_STORE_FILE"
          ccache --zero-stats
          cd android && ./gradlew bundleRelease --build-cache \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -x lintVitalRelease -x lintVitalAnalyzeRelease -x generateReleaseLintVitalModel
          ccache --show-stats

      # The same forbidden list as "Release manifest check" in docs/store/google-play.md.
      - name: Check the release manifest
        if: steps.secrets.outputs.ready == 'true'
        run: |
          manifest=android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          grep -q BLUETOOTH_SCAN "$manifest"
          if grep -E 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|c2dm.permission.RECEIVE|FirebaseMessagingService|FirebaseInstanceIdReceiver|TransportBackendDiscovery|com\.google\.firebase\.components\.ComponentDiscoveryService|com\.google\.firebase\.provider\.FirebaseInitProvider' "$manifest"; then
            echo "::error::The release manifest has a forbidden permission or component"
            exit 1
          fi

      - name: Upload to internal testing
        if: steps.secrets.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.devanshchoubey.oneremote
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
