plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.devanshchoubey.oneremote'
version = '0.1.0'

android {
  namespace "expo.modules.lansocket"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The same OkHttp React Native ships (react-native/gradle/libs.versions.toml); Gradle resolves one.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
